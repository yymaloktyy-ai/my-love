<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coming Soon | M & T</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-pink: #fbc2eb;
            --rose-accent: #ff4d6d;
            --text-dark: #4a1c2c;
            --glass-card: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #fbc2eb 0%, #ff9a9e 100%);
            background-attachment: fixed;
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Loader --- */
        #loader {
            position: fixed;
            inset: 0;
            background: #fbc2eb;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.8s ease;
        }
        .loader-ring {
            width: 50px; height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid var(--rose-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1000px;
            height: 60px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 100px;
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 1000;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-dark);
            background: rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--glass-border);
            transition: 0.3s;
        }
        .back-btn:hover { background: var(--rose-accent); color: white; }

        /* --- Card --- */
        .soon-container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            z-index: 10;
        }

        .glass-card {
            background: var(--glass-card);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 60px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            animation: cardPop 1s ease-out;
        }

        @keyframes cardPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .soon-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(40px, 10vw, 65px);
            color: var(--rose-accent);
            margin-bottom: 20px;
        }

        .progress-box { margin-top: 30px; }
        .progress-label { font-size: 11px; letter-spacing: 2px; margin-bottom: 10px; opacity: 0.7; }
        .progress-container { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.2); border-radius: 10px; overflow: hidden; }
        .progress-bar { width: 75%; height: 100%; background: var(--rose-accent); border-radius: 10px; animation: loadingProgress 2s ease-in-out infinite alternate; }

        @keyframes loadingProgress { 0% { width: 70%; } 100% { width: 80%; } }

        .heart-particle { position: fixed; pointer-events: none; color: var(--rose-accent); opacity: 0.3; animation: float 8s linear forwards; z-index: -1; }
        @keyframes float { from { transform: translateY(110vh); } to { transform: translateY(-10vh); } }

        footer { position: fixed; bottom: 20px; font-size: 11px; opacity: 0.6; }
    </style>
</head>
<body>

    <div id="loader"><div class="loader-ring"></div></div>

    <nav>
        <!-- هذا الزر سيرجعك لصفحة index.html -->
        <a href="index.html" class="back-btn" onclick="setSession()">
            <span>←</span> Back
        </a>
        <div style="font-family: 'Playfair Display', serif; font-weight: 700;">maloktyy</div>
    </nav>

    <div class="soon-container">
        <div class="glass-card">
            <h1 class="soon-title" id="typewriter">soon</h1>
            <div class="progress-box">
                
                <div class="progress-container">
                    <div class="progress-bar"></div>
                </div>
            </div>
        </div>
    </div>

<footer>© 2026 My Favorite Project Will Always Be You • lolyy</footer>


    <script>
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                    startTypewriter();
                }, 800);
            }, 500);
            setInterval(createParticle, 1000);
        };

        // وظيفة الحفاظ على الجلسة مفتوحة عند الرجوع
        function setSession() {
            sessionStorage.setItem('unlocked', 'true');
        }



        function createParticle() {
            const p = document.createElement('div');
            p.className = 'heart-particle';
            p.innerHTML = '❤';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.fontSize = (Math.random() * 10 + 15) + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 8000);
        }
    </script>
</body>
</html>
