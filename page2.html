    <style>
        :root {
            --bg-pink: #fbc2eb;
            --rose-accent: #ff4d6d;
            --text-dark: #4a1c2c;
            --glass-card: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #fbc2eb 0%, #ff9a9e 100%);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        /* --- Loader --- */
        #loader {
            position: fixed;
            inset: 0;
            background: #fbc2eb;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.8s ease;
        }
        .loader-ring {
            width: 50px; height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid var(--rose-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            height: 60px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 100px;
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 1000;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-dark);
            background: rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--glass-border);
            transition: 0.3s;
        }
        .back-btn:hover { background: var(--rose-accent); color: white; }

        /* --- Main Card --- */
        .card-wrapper {
            width: 100%;
            max-width: 600px;
            z-index: 10;
        }

        .glass-card {
            background: var(--glass-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 60px 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            text-align: center;
            animation: cardPop 1s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }

        @keyframes cardPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- Daily Message Style --- */
        #daily-quote {
            font-family: 'Playfair Display', serif;
            /* حجم خط مرن يتناسب مع حجم الشاشة */
            font-size: clamp(24px, 6vw, 42px);
            line-height: 1.3;
            color: var(--text-dark);
            font-weight: 600;
            margin-bottom: 30px;
        }

        /* --- Progress Bar --- */
        .progress-box {
            width: 100px;
            margin: 0 auto;
        }
        .progress-container { 
            width: 100%; 
            height: 4px; 
            background: rgba(255, 255, 255, 0.3); 
            border-radius: 10px; 
            overflow: hidden; 
        }
        .progress-bar { 
            width: 50%; 
            height: 100%; 
            background: var(--rose-accent); 
            animation: moveBar 2s ease-in-out infinite alternate; 
        }

        @keyframes moveBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }

        /* --- Hearts Particles --- */
        .heart-particle { 
            position: fixed; 
            pointer-events: none; 
            color: var(--rose-accent); 
            opacity: 0.3; 
            animation: floatUp 7s linear forwards; 
            z-index: -1; 
        }
        @keyframes floatUp { 
            from { transform: translateY(110vh) rotate(0deg); } 
            to { transform: translateY(-10vh) rotate(360deg); } 
        }

        footer { 
            position: fixed; 
            bottom: 20px; 
            font-size: 10px; 
            letter-spacing: 1px;
            opacity: 0.5; 
            text-transform: uppercase;
        }

        /* Responsive adjustments for mobile */
        @media (max-width: 480px) {
            .glass-card { padding: 40px 25px; }
            nav { width: 92%; }
        }
    </style>
</head>
