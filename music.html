<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Soundtrack | Pure Luxury</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-pink: #fbc2eb;
            --rose-accent: #ff4d6d;
            --text-dark: #4a1c2c;
            --glass-card: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
            --player-height: 85px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #fbc2eb 0%, #ff9a9e 100%);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            padding-bottom: calc(var(--player-height) + 50px);
        }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            max-width: 1100px;
            height: 65px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 100px;
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 5000;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-dark);
            background: rgba(255, 255, 255, 0.4);
            padding: 8px 25px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--glass-border);
            transition: 0.3s ease;
        }
        .back-btn:hover { background: white; transform: translateY(-1px); }

        /* --- Content Layout --- */
        .container {
            width: 90%;
            max-width: 800px;
            margin: 130px auto 40px;
            animation: fadeIn 1s ease-out;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 70px;
        }
        .hero-section h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(34px, 8vw, 55px);
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .hero-section p { 
            text-transform: uppercase; 
            font-size: 10px; 
            letter-spacing: 4px; 
            font-weight: 600;
            opacity: 0.6;
        }

        /* --- Minimal List View --- */
        .music-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .song-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            padding: 22px 35px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .song-card:hover { 
            background: rgba(255, 255, 255, 0.7); 
            transform: translateX(8px);
        }

        .song-info-group { display: flex; align-items: center; gap: 25px; }
        
        .index-number {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            opacity: 0.4;
            font-style: italic;
        }

        .song-card h3 { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            font-size: 16px; 
            margin-bottom: 2px;
            font-weight: 600;
        }
        .song-card p { font-size: 12px; opacity: 0.5; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }

        .btn-mini-play {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            opacity: 0;
            transition: 0.3s;
        }
        .song-card:hover .btn-mini-play { opacity: 1; }

        /* --- Player Bar (Bottom) --- */
        .player-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(160px);
            width: 90%;
            max-width: 550px;
            height: 80px;
            background: white;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            z-index: 5000;
            transition: 0.7s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }
        .player-bar.active { transform: translateX(-50%) translateY(0); }

        .p-info { width: 40%; }
        .p-meta h4 { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .p-meta p { font-size: 10px; opacity: 0.5; letter-spacing: 1px; }

        .p-controls { display: flex; flex-direction: column; align-items: center; width: 55%; gap: 6px; }
        .c-btns { display: flex; align-items: center; gap: 15px; }
        .btn-main { 
            width: 40px; height: 40px; border-radius: 50%; 
            background: var(--text-dark); color: white; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer;
        }
        .btn-sec { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-dark); opacity: 0.4; }

        .p-progress { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 9px; opacity: 0.5; }
        .bar-bg { flex: 1; height: 2px; background: #eee; cursor: pointer; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--text-dark); width: 0%; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        footer { 
            text-align: center; 
            padding: 50px 0 30px; 
            font-size: 10px; 
            opacity: 0.4; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-weight: 600;
        }
    </style>
</head>
<body>

    <nav>
        <!-- هذا الزر سيرجعك لصفحة index.html -->
        <a href="index.html" class="back-btn" onclick="setSession()">
            Back
        </a>
        <div style="font-family: 'Playfair Display', serif; font-weight: 700;">maloktyy</div>
    </nav>

    <div class="container">
        <header class="hero-section">
                <h1>Songs for You</h1>
                <p>"These aren't just songs they're little pieces of my heart for you"</p>
        </header>

        <div class="music-grid" id="grid">
            <!-- Renders without images via JS -->
        </div>
    </div>

        

    </div>
    <footer>© 2026 Every Song Here Carries a Piece of My Heart • Lolyyy ❤️</footer>


    <div class="player-bar" id="player">
        <div class="p-info">
            <div class="p-meta">
                <h4 id="pTitle">Select a track</h4>
                <p id="pArtist">PLAYER READY</p>
            </div>
        </div>

        <div class="p-controls">
            <div class="c-btns">
                <button class="btn-sec" onclick="skip(-1)">⏮</button>
                <div class="btn-main" id="playBtn">▶</div>
                <button class="btn-sec" onclick="skip(1)">⏭</button>
            </div>
            <div class="p-progress">
                <span id="currentTime">0:00</span>
                <div class="bar-bg" id="progressArea">
                    <div class="bar-fill" id="progressFill"></div>
                </div>
                <span id="durationTime">0:00</span>
            </div>
        </div>
        <audio id="mainAudio"></audio>
    </div>

    <script>

        const TRACK_DATA = [
    {
        id: 1,
        title: "Agmal Youm",
        artist: "Mohamed Hamaki",
        url: "music/Hamaki_-_Agmal_Youm.mp3"
    },
    {
        id: 2,
        title: "Bahebak",
        artist: "Tamer Hosny",
        url: "music/اغنية هتجوزك - موقع مطبعه.mp3"
    },
    {
        id: 3,
        title: "Enta elhaz",
        artist: "Amr Diab",
        url: "music/اغنية انت الحظ - موقع مطبعه.mp3"
    },
    {
        id: 4,
        title: "Tamally Ma'ak",
        artist: "Amr Diab",
        url: "music/02.Tamally_Maak.mp3"
    }
    
];


        let currentIndex = -1;
        const audio = document.getElementById('mainAudio');
        const grid = document.getElementById('grid');
        const player = document.getElementById('player');
        const playBtn = document.getElementById('playBtn');

        function renderTracks() {
            grid.innerHTML = TRACK_DATA.map((track, i) => `
                <div class="song-card" onclick="playSong(${i})">
                    <div class="song-info-group">
                        <span class="index-number">0${i + 1}</span>
                        <div>
                            <h3>${track.title}</h3>
                            <p>${track.artist}</p>
                        </div>
                    </div>
                    <div class="btn-mini-play">▶</div>
                </div>
            `).join('');
        }

        function playSong(index) {
            if (index === currentIndex) return togglePlay();
            
            currentIndex = index;
            const track = TRACK_DATA[index];
            audio.src = track.url;
            audio.play();
            
            document.getElementById('pTitle').innerText = track.title;
            document.getElementById('pArtist').innerText = track.artist;
            
            player.classList.add('active');
            playBtn.innerHTML = '⏸';
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.innerHTML = '⏸';
            } else {
                audio.pause();
                playBtn.innerHTML = '▶';
            }
        }

        playBtn.onclick = togglePlay;

        function skip(dir) {
            let next = currentIndex + dir;
            if (next < 0) next = TRACK_DATA.length - 1;
            if (next >= TRACK_DATA.length) next = 0;
            playSong(next);
        }

        audio.ontimeupdate = () => {
            if (isNaN(audio.duration)) return;
            const pct = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
            document.getElementById('durationTime').innerText = formatTime(audio.duration);
        };

        function formatTime(s) {
            let m = Math.floor(s / 60);
            let sec = Math.floor(s % 60);
            return `${m}:${sec < 10 ? '0' + sec : sec}`;
        }

        function setSession() {
            sessionStorage.setItem('unlocked', 'true');
        }
        // Initialize immediately
        renderTracks();
    </script>
</body>
</html>
