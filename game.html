<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Love Collector • Infinite System</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --rose: #ff4d6d;
            --rose-dark: #c9184a;
            --rose-light: #ff85a2;
            --glass: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.7);
            --text: #4a1c2c;
            --safe-top: env(safe-area-inset-top);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: linear-gradient(135deg, #fbc2eb 0%, #ff9a9e 100%);
            background-attachment: fixed;
            height: 100vh; height: -webkit-fill-available;
            overflow: hidden; color: var(--text);
            display: flex; flex-direction: column;
            position: fixed; width: 100%;
        }

        #loader { position: fixed; inset: 0; background: #fbc2eb; z-index: 10000; display: flex; justify-content: center; align-items: center; transition: 0.8s; }
        .loader-ring { width: 45px; height: 45px; border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid var(--rose); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        nav {
            position: relative; margin-top: calc(var(--safe-top) + 15px);
            align-self: center; width: 92%; max-width: 800px; height: 60px;
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 100px; border: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 1000;
        }
        .back-btn { text-decoration: none; color: var(--text); background: var(--glass); padding: 8px 16px; border-radius: 50px; font-size: 11px; font-weight: 800; border: 1px solid var(--glass-border); }

        .game-ui {
            position: relative; margin-top: 15px; width: 100%; display: flex; justify-content: center; gap: 8px; z-index: 10; padding: 0 10px;
        }
        .ui-panel {
            background: var(--glass); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 8px 15px; border-radius: 18px; border: 1px solid var(--glass-border);
            display: flex; align-items: center; gap: 6px; flex: 1; max-width: 120px;
        }
        .ui-label { font-size: 7.5px; font-weight: 800; opacity: 0.6; text-transform: uppercase; display: block; }
        .ui-value { font-size: 14px; font-weight: 800; }

        #arena { flex: 1; position: relative; width: 100%; touch-action: none; overflow: hidden; cursor: none; }
        #basket {
            position: absolute; bottom: 40px; left: 50%; width: 90px; height: 45px;
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 2px solid white; border-radius: 12px 12px 30px 30px;
            transform: translateX(-50%); display: flex; align-items: center; justify-content: center;
            font-size: 22px; box-shadow: 0 10px 25px rgba(255, 77, 109, 0.2); will-change: left; z-index: 50;
        }

        .drop-item { position: absolute; top: -50px; font-size: 32px; pointer-events: none; will-change: transform; }

        #modal {
            position: fixed; inset: 0; background: rgba(251, 194, 235, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: none; justify-content: center; align-items: center; z-index: 9000; padding: 20px;
        }
        .card {
            background: white; padding: 30px 20px; border-radius: 35px;
            text-align: center; width: 100%; max-width: 380px;
            border: 1px solid var(--glass-border); box-shadow: 0 30px 60px rgba(74, 28, 44, 0.1);
            max-height: 85vh; display: flex; flex-direction: column;
        }

        .msg-scroll {
            margin: 15px 0; overflow-y: auto; flex: 1; padding: 5px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .love-bubble {
            background: #fff0f3; padding: 12px 16px; border-radius: 15px;
            border-left: 4px solid var(--rose); font-size: 13.5px; line-height: 1.4; color: #5a2a3a;
            text-align: left; animation: popIn 0.4s ease-out backwards;
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .discovery-stats { font-size: 9px; font-weight: 700; color: var(--rose); margin-top: 5px; text-transform: uppercase; opacity: 0.8; }

        .btn-play {
            background: var(--rose); color: white; border: none; padding: 16px;
            border-radius: 100px; font-weight: 800; cursor: pointer; width: 100%; font-size: 16px;
        }

        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        footer { position: fixed; bottom: 10px; width: 100%; text-align: center; font-size: 8px; opacity: 0.5; letter-spacing: 1px; }
    </style>
</head>

        let score = 0, lives = 3, isRunning = true;
        let highScore = localStorage.getItem('malakHS') || 0;
        let seenIndices = JSON.parse(localStorage.getItem('malakSeenMsgs')) || [];

        const basket = document.getElementById('basket'), arena = document.getElementById('arena');
        document.getElementById('high-score').innerText = highScore;

        window.onload = () => {
            setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 600);
            init();
        };

        function handleInput(e) {
            if(!isRunning) return;
            const x = (e.type.includes('mouse') ? e.clientX : e.touches[0].clientX);
            const rect = arena.getBoundingClientRect();
            let pos = x - rect.left;
            const limit = basket.offsetWidth / 2;
            pos = Math.max(limit, Math.min(rect.width - limit, pos));
            basket.style.left = pos + 'px';
        }

        arena.addEventListener('mousemove', handleInput);
        arena.addEventListener('touchmove', (e) => { e.preventDefault(); handleInput(e); }, {passive: false});

        function init() {
            if(!isRunning) return;
            spawn();
            let tempo = Math.max(300, 1100 - (score * 18));
            setTimeout(init, tempo);
        }

        function spawn() {
            if(!isRunning) return;
            const item = document.createElement('div');
            item.className = 'drop-item';
            item.innerHTML = ['❤️','💖','🌹','✨','🌸'][Math.floor(Math.random()*5)];
            item.style.left = (Math.random() * (arena.offsetWidth - 60)) + 30 + 'px';
            arena.appendChild(item);

            let y = -50;
            let speed = (arena.offsetHeight / 350) + (score * 0.15);

            function fall() {
                if(!isRunning) { item.remove(); return; }
                y += speed;
                item.style.top = y + 'px';
                const r = item.getBoundingClientRect(), b = basket.getBoundingClientRect();
                
                if (r.bottom >= b.top && r.bottom <= b.bottom && r.right >= b.left && r.left <= b.right) {
                    score++;
                    document.getElementById('score-text').innerText = score;
                    basket.style.transform = 'translateX(-50%) scale(1.1)';
                    setTimeout(()=> basket.style.transform='translateX(-50%)', 100);
                    item.remove();
                } else if (y > arena.offsetHeight) {
                    item.remove(); lives--; updateUI();
                    document.body.classList.add('shake');
                    setTimeout(()=>document.body.classList.remove('shake'), 400);
                    if(lives <= 0) over();
                } else { requestAnimationFrame(fall); }
            }
            fall();
        }

        function updateUI() {
            let s = ""; for(let i=0; i<3; i++) s += (i < lives) ? "❤️" : "🖤";
            document.getElementById('lives-text').innerText = s;
        }

        function over() {
            isRunning = false;
            if(score > highScore) { 
                highScore = score; 
                localStorage.setItem('malakHS', highScore); 
                document.getElementById('high-score').innerText = highScore;
            }

            const container = document.getElementById('msg-container');
            container.innerHTML = "";
            document.getElementById('final-score').innerText = score;

            // تحديد كم رسالة ستظهر بناءً على السكور
            let numToGet = Math.max(1, Math.floor(score / 5));
            if(numToGet > 8) numToGet = 8; 

            // نظام عدم التكرار الذكي
            let pool = [];
            loveMessages.forEach((m, index) => {
                if(!seenIndices.includes(index)) pool.push(index);
            });

            // إذا انتهت كل الجمل، صفر القائمة وابدأ من جديد
            if(pool.length < numToGet) {
                seenIndices = [];
                loveMessages.forEach((_, index) => pool.push(index));
            }

            let selection = [];
            for(let i=0; i < numToGet; i++) {
                if(pool.length === 0) break;
                const randPos = Math.floor(Math.random() * pool.length);
                const msgIdx = pool[randPos];
                selection.push(loveMessages[msgIdx]);
                seenIndices.push(msgIdx); // حفظها كرسالة تمت رؤيتها
                pool.splice(randPos, 1);
            }

            localStorage.setItem('malakSeenMsgs', JSON.stringify(seenIndices));

            // تحديث العداد
            document.getElementById('discovery-msg').innerText = 
                ``;

            selection.forEach((m, i) => {
                setTimeout(() => {
                    const b = document.createElement('div');
                    b.className = 'love-bubble'; b.innerText = m;
                    container.appendChild(b);
                    container.scrollTop = container.scrollHeight;
                }, i * 400);
            });

            document.getElementById('modal').style.display = 'flex';
        }

        function reset() {
            score = 0; lives = 3; isRunning = true;
            document.getElementById('score-text').innerText = '0';
            updateUI();
            document.getElementById('modal').style.display = 'none';
            init();
        }
    </script>
